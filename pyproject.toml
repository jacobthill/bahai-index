[project]
name = "bahai-index"
version = "0.1.0"
description = "Convert the indexes of Shahvar et al., The Baha'is of Iran, Transcaspia and the Caucasus, into structured data for bahai-data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.31.0",
    "pandas>=3.0.1",
    "pymupdf>=1.27.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]
